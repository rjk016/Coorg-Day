<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d1b">
  <meta name="description" content="A live countdown to Our Special Day — October 24, 2026.">
  <title>Coorg Day | Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b17;
      --panel: rgba(19, 25, 48, .78);
      --line: rgba(195, 205, 255, .16);
      --text: #f6f7ff;
      --muted: #aab3d1;
      --accent: #b7a6ff;
      --accent-2: #75d8f3;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      /* Upload backdrop.jpg beside index.html in your GitHub repository. */
      background:
        linear-gradient(rgba(8, 11, 23, .52), rgba(8, 11, 23, .68)),
        url("backdrop.jpg") center center / cover no-repeat fixed,
        linear-gradient(145deg, #080b17 0%, #11152a 52%, #080b17 100%);
    }

    /* Decorative stars, generated with CSS so no image files are needed. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .5;
      background-image:
        radial-gradient(2px 2px at 8% 18%, #fff 45%, transparent 55%),
        radial-gradient(1px 1px at 22% 72%, #c8d5ff 45%, transparent 55%),
        radial-gradient(2px 2px at 81% 17%, #fff 45%, transparent 55%),
        radial-gradient(1px 1px at 90% 62%, #d8dcff 45%, transparent 55%),
        radial-gradient(1px 1px at 67% 83%, #fff 45%, transparent 55%),
        radial-gradient(2px 2px at 42% 12%, #d4d9ff 45%, transparent 55%),
        radial-gradient(1px 1px at 13% 48%, #fff 45%, transparent 55%),
        radial-gradient(1px 1px at 73% 39%, #d4d9ff 45%, transparent 55%);
    }

    .page {
      width: min(100%, 760px);
      position: relative;
      text-align: center;
      padding: clamp(26px, 6vw, 54px) clamp(18px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 90px rgba(0, 0, 0, .34);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .moon {
      width: clamp(76px, 18vw, 112px);
      aspect-ratio: 1;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff9e8 0%, #e5e0ff 32%, #b6b7e8 62%, #7e84b6 100%);
      box-shadow: 0 0 35px rgba(190, 180, 255, .22), 0 0 100px rgba(129, 126, 228, .13);
      position: relative;
      overflow: hidden;
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      left: 20%;
      top: -7%;
      border-radius: 50%;
      background: #171a32;
      opacity: .14;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 760;
      text-wrap: balance;
    }

    .subtitle {
      margin: 16px auto 0;
      max-width: 460px;
      color: var(--muted);
      font-size: clamp(.96rem, 2.7vw, 1.08rem);
      line-height: 1.65;
    }


    .agenda-link-wrap {
      margin: 24px 0 0;
      display: flex;
      justify-content: center;
    }

    .agenda-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 22px;
      border: 1px solid rgba(183, 166, 255, .45);
      border-radius: 999px;
      color: var(--text);
      background: rgba(183, 166, 255, .12);
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }

    .agenda-link:hover {
      transform: translateY(-2px);
      background: rgba(183, 166, 255, .2);
    }

    .agenda-link:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 3px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 14px);
      margin: clamp(28px, 6vw, 44px) 0 20px;
    }

    .unit {
      min-width: 0;
      padding: clamp(12px, 3vw, 20px) 4px;
      border: 1px solid rgba(190, 197, 255, .14);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    }

    .number {
      display: block;
      font-size: clamp(1.55rem, 6vw, 3rem);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
      font-weight: 750;
    }

    .label {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: clamp(.58rem, 1.8vw, .75rem);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .event-date {
      margin: 0;
      color: #d9dcf4;
      font-size: .92rem;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      min-height: 46px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      font: inherit;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

    .share-button {
      color: #101329;
      background: linear-gradient(110deg, #d2c6ff, #a9e9f8);
    }

    .copy-button {
      color: var(--text);
      background: rgba(255,255,255,.055);
      border-color: var(--line);
    }

    .status {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: var(--accent-2);
      font-size: .86rem;
    }

    footer {
      margin-top: 30px;
      color: #838dab;
      font-size: .76rem;
      letter-spacing: .04em;
    }

    @media (max-width: 420px) {
      .page { border-radius: 22px; }
      .countdown { gap: 6px; }
      .unit { border-radius: 12px; }
      .label { letter-spacing: .06em; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="moon" aria-hidden="true"></div>
    <p class="eyebrow">A moment to look forward to</p>
    <h1>A Day at Nakoor Volkot</h1>
    <p class="subtitle">Every second brings us closer. Let the countdown begin.</p>


    <div class="agenda-link-wrap">
      <a class="agenda-link" href="agenda.html">☷ Agenda</a>
    </div>

    <section class="countdown" aria-label="Time remaining until Our Special Day" aria-live="off">
      <div class="unit"><span class="number" id="days">000</span><span class="label">Days</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>

    <p class="event-date">Saturday, October 24, 2026 · 2:00 PM India Standard Time</p>

    <div class="actions">
      <button class="share-button" id="shareButton" type="button">Share ↗</button>
      <button class="copy-button" id="copyButton" type="button">Copy link</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <footer>JeenaVS Annieversary Edition - Made for a moment that matters ✦</footer>
  </main>

  <script>
    // Event deadline: October 24, 2026 at 2:00 PM India Standard Time.
    const targetTime = new Date("2026-10-24T14:00:00+05:30").getTime();

    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    const statusMessage = document.getElementById("status");
    const shareButton = document.getElementById("shareButton");
    const copyButton = document.getElementById("copyButton");

    function updateCountdown() {
      const difference = targetTime - Date.now();

      if (difference <= 0) {
        elements.days.textContent = "000";
        elements.hours.textContent = "00";
        elements.minutes.textContent = "00";
        elements.seconds.textContent = "00";
        document.querySelector(".subtitle").textContent = "The day is here. Make it unforgettable!";
        document.title = "Coorg Day is here!";
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      elements.days.textContent = String(days).padStart(3, "0");
      elements.hours.textContent = String(hours).padStart(2, "0");
      elements.minutes.textContent = String(minutes).padStart(2, "0");
      elements.seconds.textContent = String(seconds).padStart(2, "0");

      document.title = `${days}d ${hours}h ${minutes}m ${seconds}s |A Day at Nakoor Volkot`;
    }

    async function copyLink() {
      const link = window.location.href;
      try {
        await navigator.clipboard.writeText(link);
        statusMessage.textContent = "Link copied. Share it JeenaVS Member!";
      } catch (error) {
        statusMessage.textContent = "Copy isn't available here. You can copy the page address from your browser.";
      }
    }

    async function shareCountdown() {
      const shareData = {
        title: "Our Special Day",
        text: "Join the countdown to Our Coorg Day!",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          statusMessage.textContent = "Thanks for sharing!";
        } catch (error) {
          if (error.name !== "AbortError") {
            statusMessage.textContent = "Sharing was unavailable. Try Copy page link instead.";
          }
        }
      } else {
        await copyLink();
      }
    }

    shareButton.addEventListener("click", shareCountdown);
    copyButton.addEventListener("click", copyLink);

    updateCountdown();
    // Recalculate from the real deadline every second; it does not drift by subtracting one.
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
